[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mouse-server"
version = "0.1.0"
description = "Mouse: PWA remote control server for Windows PC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "cryptography>=43.0.0",
    "pynput>=1.7.7",
    "pystray>=0.19.5",
    "Pillow>=10.4.0",
    "qrcode>=8.0",
    "zeroconf>=0.135.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "pyinstaller>=6.11.0",
]

[project.scripts]
mouse-server = "mouse_server.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mouse_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
